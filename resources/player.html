<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kanzi Player</title>
<!--
  Hidden MusicKit JS host. Loaded with a https://music.apple.com base URL so the
  web player's developer token and CORS rules accept it. All UI is native QML;
  this page only decodes (Widevine-protected) audio and reports state back over
  the Qt WebChannel object `bridge` (the C++ Player).
-->
<script>/*QWEBCHANNEL_JS*/</script>
<script>
"use strict";
const DEVELOPER_TOKEN = "%DEVELOPER_TOKEN%";
const STORED_USER_TOKEN = "%USER_TOKEN%";
const APP_VERSION = "%VERSION%";
const INITIAL_VOLUME = %VOLUME%;
const INITIAL_TRANSITIONS = %TRANSITIONS%;

let bridge = null;
let music = null;

function log(...args) {
    console.log(...args);
    if (bridge) bridge.jsLog(args.map(String).join(" "));
}
function fail(msg, e) {
    const text = msg + (e ? ": " + (e.message || e.description || e.errorCode || String(e)) : "");
    console.error(text, e);
    if (bridge) bridge.jsError(text);
}

function catalogIdOf(item) {
    const pp = item.playParams || (item.attributes && item.attributes.playParams) || {};
    if (pp.catalogId) return String(pp.catalogId);
    if (/^\d+$/.test(String(item.id))) return String(item.id);
    return "";
}

function mapItem(item) {
    if (!item) return {};
    const a = item.attributes || {};
    return {
        id: String(item.id || ""),
        catalogId: catalogIdOf(item),
        type: item.type || "",
        title: a.name || item.title || "",
        artist: a.artistName || item.artistName || "",
        album: a.albumName || item.albumName || "",
        artwork: (a.artwork && a.artwork.url) || (item.artwork && item.artwork.url) || "",
        artworkColor: (a.artwork && a.artwork.bgColor) || "",
        duration: (a.durationInMillis || item.playbackDuration || 0) / 1000,
        explicit: a.contentRating === "explicit",
        hasLyrics: !!a.hasLyrics,
        url: a.url || "",
        storefront: (music && music.storefrontId) || "",
    };
}

// ---------------------------------------------------------------------------
// Transitions: crossfade and AutoMix.
//
// MusicKit plays a single DRM stream and can't preload the next song, so two songs
// never overlap. Instead MusicKit's <audio> element is routed through Web Audio:
//   element → MediaElementSource → fade GainNode → destination
//                                 ↘ AnalyserNode (level meter for AutoMix)
// The fade gain is separate from the user's volume (music.volume), and it's
// recomputed from the remaining time on every tick, so pausing and seeking just work.
// ---------------------------------------------------------------------------
const transitions = {
    crossfade: INITIAL_TRANSITIONS.crossfade || 0, // seconds, 0 = off
    automix: !!INITIAL_TRANSITIONS.automix,
};
const audio = { ctx: null, gain: null, analyser: null, buf: null, attached: new WeakSet() };
const fade = {
    active: false,     // fading out the current song
    length: 0,         // seconds the current fade-out spans
    quietSince: -1,    // AutoMix: playback time at which the tail went quiet
    loudSeen: false,   // AutoMix: the song has had real content (not a silent track)
    advancing: false,  // skipToNextItem in flight
};
const QUIET_DB = -46;        // below this the tail counts as silence / faded out
const LOUD_DB = -30;
const AUTOMIX_WINDOW = 25;   // seconds before the end in which AutoMix may cut in
const AUTOMIX_QUIET_HOLD = 1.2;
const FADE_IN = 1.5;

function transitionsEnabled() { return transitions.crossfade > 0 || transitions.automix; }

function attachAudio(el) {
    if (!el || audio.attached.has(el) || !transitionsEnabled())
        return;
    try {
        if (!audio.ctx) {
            audio.ctx = new AudioContext({ latencyHint: "playback" });
            audio.gain = audio.ctx.createGain();
            audio.analyser = audio.ctx.createAnalyser();
            audio.analyser.fftSize = 2048;
            audio.buf = new Float32Array(audio.analyser.fftSize);
            audio.gain.connect(audio.ctx.destination);
        }
        const src = audio.ctx.createMediaElementSource(el);
        src.connect(audio.gain);
        src.connect(audio.analyser);
        audio.attached.add(el);
        log("transitions: audio graph attached");
    } catch (e) {
        log("transitions: Web Audio unavailable, fades disabled:", e.message || e);
    }
}

// MusicKit creates its media element lazily; catch it the first time it plays.
document.addEventListener("play", (e) => {
    if (e.target instanceof HTMLMediaElement) {
        attachAudio(e.target);
        if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
    }
}, true);

function levelDb() {
    if (!audio.analyser) return 0;
    audio.analyser.getFloatTimeDomainData(audio.buf);
    let sum = 0;
    for (let i = 0; i < audio.buf.length; ++i) sum += audio.buf[i] * audio.buf[i];
    const rms = Math.sqrt(sum / audio.buf.length);
    return rms > 0 ? 20 * Math.log10(rms) : -120;
}

function setFadeGain(value, smoothing) {
    if (!audio.gain) return;
    const now = audio.ctx.currentTime;
    audio.gain.gain.cancelScheduledValues(now);
    audio.gain.gain.setTargetAtTime(Math.max(0, Math.min(1, value)), now, smoothing || 0.04);
}

function hasNextItem() {
    const q = music.queue;
    return music.repeatMode === 2 || (q && q.position + 1 < q.items.length);
}

function resetFade() {
    fade.active = false;
    fade.length = 0;
    fade.quietSince = -1;
    fade.loudSeen = false;
}

// Songs blocked by the account's content restrictions (e.g. explicit content
// with an age limit) can't be played at all; step over them.
function isRestricted(e) {
    return !!e && /CONTENT_RESTRICTED/.test(String(e.errorCode || "") + " " + String(e.name || "") + " " + String(e.message || ""));
}

function reportRestricted() {
    const item = music.nowPlayingItem;
    const title = item ? ((item.attributes && item.attributes.name) || item.title || "") : "";
    const text = title ? `Skipped “${title}”: blocked by your Apple ID's content restrictions`
                       : "Skipped a song blocked by your Apple ID's content restrictions";
    console.warn(text);
    if (bridge) bridge.jsError(text);
}

let skipping = false;
async function skipForward(label) {
    if (skipping) return;
    skipping = true;
    try {
        for (let tries = 0; ; ++tries) {
            try {
                await music.skipToNextItem();
                return;
            } catch (e) {
                if (!isRestricted(e)) return fail(label, e);
                reportRestricted();
                if (tries >= 5 || !hasNextItem()) return;
            }
        }
    } finally {
        skipping = false;
    }
}

async function advance() {
    if (fade.advancing) return;
    fade.advancing = true;
    await skipForward("Transition failed");
    fade.advancing = false;
}

function transitionTick() {
    if (!music || !audio.gain || !transitionsEnabled()) return;
    if (music.playbackState !== MusicKit.PlaybackStates.playing || fade.advancing) return;
    if (music.repeatMode === 1 || !hasNextItem()) { setFadeGain(1); return; }

    const t = music.currentPlaybackTime || 0;
    const duration = music.currentPlaybackDuration || 0;
    if (duration < 30) return; // don't touch interludes and very short tracks
    const remaining = duration - t;

    // AutoMix: a tail that has already faded to silence ends the song early.
    if (transitions.automix) {
        const db = levelDb();
        if (db > LOUD_DB) fade.loudSeen = true;
        if (remaining <= AUTOMIX_WINDOW && fade.loudSeen && db < QUIET_DB) {
            if (fade.quietSince < 0) fade.quietSince = t;
            if (t - fade.quietSince >= AUTOMIX_QUIET_HOLD && !fade.active) {
                log("automix: quiet tail, advancing with", remaining.toFixed(1), "s left");
                setFadeGain(0, 0.15);
                setTimeout(advance, 400);
                fade.active = true;
                return;
            }
        } else {
            fade.quietSince = -1;
        }
    }

    // Crossfade (AutoMix without an explicit length uses 6 s).
    const length = transitions.crossfade > 0 ? transitions.crossfade : (transitions.automix ? 6 : 0);
    if (length <= 0) return;
    if (remaining <= length) {
        fade.active = true;
        fade.length = length;
        const x = Math.max(0, remaining / length);
        setFadeGain(Math.sin(x * Math.PI / 2)); // equal-power curve
        if (remaining <= 0.35) advance();
    } else if (fade.active) {
        // Seeked back out of the fade zone.
        fade.active = false;
        setFadeGain(1, 0.1);
    }
}

function onTrackChanged() {
    const fadingIn = fade.active || fade.advancing;
    resetFade();
    if (!audio.gain) return;
    if (fadingIn && transitionsEnabled()) {
        audio.gain.gain.cancelScheduledValues(audio.ctx.currentTime);
        audio.gain.gain.setValueAtTime(0.0001, audio.ctx.currentTime);
        audio.gain.gain.linearRampToValueAtTime(1, audio.ctx.currentTime + FADE_IN);
    } else {
        setFadeGain(1, 0.02);
    }
}

setInterval(transitionTick, 100);

function pushState() { bridge.jsState(music.playbackState); }
function pushTime() { bridge.jsTime(music.currentPlaybackTime || 0, music.currentPlaybackDuration || 0); }
function pushNowPlaying() { bridge.jsNowPlaying(mapItem(music.nowPlayingItem)); }
function pushModes() { bridge.jsModes(music.shuffleMode === 1, music.repeatMode); }
function pushQueue() {
    const q = music.queue;
    bridge.jsQueue(q ? q.items.map(mapItem) : [], q ? q.position : -1);
}
function pushToken() { bridge.jsUserToken(music.isAuthorized ? (music.musicUserToken || "") : ""); }

function descriptor(type, id) {
    const d = {};
    d[type] = id;
    return d;
}

async function onCommand(name, args) {
    if (!music && name !== "unauthorize") return;
    try {
        switch (name) {
        case "setQueue": {
            if (args.shuffle) music.shuffleMode = 1;
            else if (music.shuffleMode === 1 && args.startIndex > 0) music.shuffleMode = 0;
            const opts = descriptor(args.type, args.id);
            opts.startPlaying = true;
            if (args.startIndex > 0) opts.startWith = args.startIndex;
            await music.setQueue(opts);
            try {
                if (music.playbackState !== MusicKit.PlaybackStates.playing) await music.play();
            } catch (e) {
                if (!isRestricted(e)) throw e;
                reportRestricted();
                if (hasNextItem()) await skipForward("setQueue failed");
            }
            break;
        }
        case "playNext":
            await music.playNext(descriptor(args.type, args.id));
            break;
        case "playLater":
            await music.playLater(descriptor(args.type, args.id));
            break;
        case "jumpTo":
            await music.changeToMediaAtIndex(args.index);
            break;
        case "play": await music.play(); break;
        case "pause": music.pause(); break;
        case "next": await skipForward("next failed"); break;
        case "previous": await music.skipToPreviousItem(); break;
        case "seek": await music.seekToTime(args.time); break;
        case "volume": music.volume = args.value; break;
        case "shuffle": music.shuffleMode = args.value ? 1 : 0; pushModes(); break;
        case "repeat": music.repeatMode = args.value; pushModes(); break;
        case "transitions":
            transitions.crossfade = args.crossfade || 0;
            transitions.automix = !!args.automix;
            if (transitionsEnabled())
                document.querySelectorAll("audio, video").forEach(attachAudio);
            else
                setFadeGain(1, 0.05);
            break;
        case "authorize": {
            const token = await music.authorize();
            bridge.jsUserToken(token || "");
            break;
        }
        case "unauthorize":
            if (music) await music.unauthorize();
            bridge.jsUserToken("");
            break;
        default:
            log("unknown command", name);
        }
    } catch (e) {
        fail(name + " failed", e);
    }
}

async function startMusicKit() {
    try {
        music = await MusicKit.configure({
            developerToken: DEVELOPER_TOKEN,
            app: { name: "Kanzi", build: APP_VERSION },
        });
    } catch (e) {
        fail("MusicKit could not be configured", e);
        return;
    }

    // Carry a token we already know about into a fresh MusicKit store.
    if (!music.isAuthorized && STORED_USER_TOKEN) {
        try { music.musicUserToken = STORED_USER_TOKEN; } catch (e) { /* read-only in some builds */ }
    }

    music.volume = INITIAL_VOLUME;
    const E = MusicKit.Events;
    music.addEventListener(E.playbackStateDidChange, pushState);
    music.addEventListener(E.playbackTimeDidChange, pushTime);
    music.addEventListener(E.playbackDurationDidChange, pushTime);
    music.addEventListener(E.nowPlayingItemDidChange, () => { onTrackChanged(); pushNowPlaying(); pushQueue(); });
    music.addEventListener(E.queueItemsDidChange, pushQueue);
    music.addEventListener(E.queuePositionDidChange, pushQueue);
    music.addEventListener(E.playbackVolumeDidChange, () => bridge.jsVolume(music.volume));
    music.addEventListener(E.authorizationStatusDidChange, pushToken);
    if (E.repeatModeDidChange) music.addEventListener(E.repeatModeDidChange, pushModes);
    if (E.shuffleModeDidChange) music.addEventListener(E.shuffleModeDidChange, pushModes);
    music.addEventListener(E.mediaPlaybackError, (e) => {
        if (!isRestricted(e)) return fail("Playback error", e);
        // Reached on its own (no crossfade); our own skips report and retry themselves.
        if (skipping) return;
        reportRestricted();
        if (hasNextItem()) skipForward("Playback error");
    });

    pushToken();
    pushModes();
    pushState();
    pushNowPlaying();
    pushQueue();
    bridge.jsReady();
    log("MusicKit", MusicKit.version, "ready; authorized:", music.isAuthorized);
}

document.addEventListener("musickitloaded", startMusicKit);

new QWebChannel(qt.webChannelTransport, (channel) => {
    bridge = channel.objects.bridge;
    bridge.command.connect(onCommand);
    if (!DEVELOPER_TOKEN) {
        fail("No developer token");
        return;
    }
    const s = document.createElement("script");
    s.src = "https://js-cdn.music.apple.com/musickit/v3/musickit.js";
    s.setAttribute("data-web-components", "");
    s.onerror = () => fail("Could not load MusicKit JS (offline?)");
    document.head.appendChild(s);
});
</script>
</head>
<body></body>
</html>
